name: CI Pull Request Check

on:
  pull_request:
    branches:
      - main
    
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres-db:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test1234
          POSTGRES_DB: nest-todo-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '24'
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: run database push
        env:
          DATABASE_URL: postgresql://test:test1234@localhost:5432/nest-todo-test
        run: npx drizzle-kit push

      - name: run tests
        env:
          DATABASE_TEST_URL: postgresql://test:test1234@localhost:5432/nest-todo-test
        run: npm test
    


